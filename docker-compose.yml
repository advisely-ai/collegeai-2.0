# Local Postgres for development. No pgvector: it isn't needed yet.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: collegeai-20-db
      POSTGRES_USER: collegeai
      POSTGRES_PASSWORD: collegeai
    ports:
      - "5432:5432"
    volumes:
      - collegeai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collegeai -d collegeai-20-db"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  collegeai_pgdata:
